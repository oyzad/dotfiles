[language-server.scls]
command = "simple-completion-language-server"

[language-server.scls.config]
feature_words = false                # enable completion by word
feature_snippets = true              # enable snippets
snippets_first = true                # completions will return before snippets by default
snippets_inline_by_word_tail = false # suggest snippets by WORD tail, for example text `xsq|` become `x^2|` when snippet `sq` has body `^2`
feature_unicode_input = false        # enable "unicode input"
feature_paths = false                # enable path completion
feature_citations = false            # enable citation completion (only on `citation` feature enabled)



[language-server.haskell-language-server-wrapper]
command = "haskell-language-server-wrapper"

[[language]]
name = "haskell"
roots = ["Setup.hs", "stack.yaml", "*.cabal"]
formatter = {command = 'fourmolu', args = ["--stdin-input-file", "%{buffer_name}"]}
auto-format = true

[[language]]
name = "markdown"
soft-wrap.enable = true

[language-server.clangd]
command = "clangd"
args = [
  "--query-driver=/usr/bin/gcc,/usr/bin/clang,/usr/bin/g++", 
  "--background-index", 
  "--clang-tidy"
]

[[language]]
name = "c"
language-servers = ["scls", "clangd"]
auto-format = true


[language-server.tinymist]
command = "tinymist"
config = { exportPdf = "onSave", previewer = "sioyek" }

[[language]]
name = "typst"
language-servers = [ "scls", "tinymist" ]

[language-server.rust-analyzer]
command = "rust-analyzer"

[[language]]
name = "rust"
auto-format = true
language-servers = [ "rust-analyzer" ]
